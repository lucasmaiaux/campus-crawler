# ============================================
# Profil PRODUCTION TEST LOCAL
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod-test.yml up
# ============================================

# Ecouter sur toutes les interfaces (nécessaire dans Docker)
server.address=0.0.0.0

# Connexion à MySQL Docker
spring.datasource.url=jdbc:mysql://mysql:3306/campus_crawler?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate - MODE UPDATE pour créer les tables automatiquement
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.defer-datasource-initialization=true

# Connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Enable SQL init mode pour charger data.sql
spring.sql.init.mode=always

# Logging - Plus verbeux pour debug
logging.level.root=INFO
logging.level.fr.campus.dungeoncrawlerapi=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Disable Flyway
spring.flyway.enabled=false

# Security headers
server.error.include-message=always
server.error.include-stacktrace=on_param

# CORS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost}
