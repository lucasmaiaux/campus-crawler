# ============================================
# Configuration COMMUNE a tous les profils
# ============================================

spring.application.name=dungeoncrawlerapi

# Tomcat configuration
server.port=9060

# JPA / Hibernate (configuration commune)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Disable Flyway
spring.flyway.enabled=false

# ============================================
# Profils disponibles :
# - dev       : Developpement local (mvn spring-boot:run)
# - prod-test : Test production locale sans SSL (docker-compose.prod-test.yml)
# - prod      : Production VPS avec SSL (docker-compose.prod.yml)
# ============================================
