# ============================================
# Profil PRODUCTION
# Usage: docker-compose -f docker-compose.prod.yml up
# ============================================

# Ecouter sur toutes les interfaces (necessaire dans Docker)
server.address=0.0.0.0

# Connexion a MySQL Docker (variables d'environnement depuis docker-compose)
spring.datasource.url=jdbc:mysql://mysql:3306/campus_crawler?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.defer-datasource-initialization=true

# Connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Enable SQL init mode to load data.sql
spring.sql.init.mode=always

# Logging
logging.level.root=INFO
logging.level.fr.campus.dungeoncrawlerapi=INFO
logging.level.org.springframework.web=WARN

# Disable Flyway
spring.flyway.enabled=false

# Security headers
server.error.include-message=never
server.error.include-stacktrace=never

# CORS - Configurer avec votre domaine de production
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost}
