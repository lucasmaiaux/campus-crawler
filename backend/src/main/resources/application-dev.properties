# ============================================
# Profil DEVELOPPEMENT LOCAL
# Usage: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ============================================

# MySQL LOCAL (Docker avec port 3306 expose)
spring.datasource.url=jdbc:mysql://localhost:3306/campus_crawler?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=campus_user
spring.datasource.password=MonPass123!

# JPA / Hibernate - Mode developpement
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# SQL initialization
spring.sql.init.mode=always

# Logging detaille pour le dev
logging.level.org.springframework.jdbc.datasource.init=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000
