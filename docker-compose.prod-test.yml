# Configuration PRODUCTION LOCALE (test Docker SANS SSL)
# Commande : docker-compose -f docker-compose.yml -f docker-compose.prod-test.yml up --build
# Usage : Tester la configuration de production en local avant le déploiement VPS

services:
  mysql:
    container_name: campus_db_prod_test
    restart: always
    volumes:
      - mysql_prod_test_data:/var/lib/mysql
      - ./backups:/backups
    # PAS de ports exposés - accès uniquement via le réseau Docker

  backend:
    container_name: campus_backend_prod_test
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod-test
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    # PAS de ports exposés - accès uniquement via nginx

  frontend:
    container_name: campus_frontend_prod_test
    restart: always
    build:
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "8080:80"  # HTTP seulement (port 8080 sur l'hôte, 80 dans le conteneur)
    volumes:
      # Configuration nginx sans SSL
      - ./docker/nginx/nginx.prod-test.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - campus_network

volumes:
  mysql_prod_test_data:
