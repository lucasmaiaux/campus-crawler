# Configuration PRODUCTION VPS avec Traefik
# Commande : docker-compose -f docker-compose.yml -f docker-compose.prod-traefik.yml --env-file .env.prod up -d
# Prérequis : Traefik doit être déployé sur le VPS avec le réseau 'traefik_public'
# Usage : Déploiement sur le VPS avec routage via Traefik (SSL géré automatiquement)

services:
  mysql:
    container_name: campus_db_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # PAS de ports exposés

  backend:
    image: ${DOCKER_USERNAME}/campus-crawler-backend:${VERSION:-latest}
    container_name: campus_backend_prod
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    # PAS de ports exposés

  frontend:
    image: ${DOCKER_USERNAME}/campus-crawler-frontend:${VERSION:-latest}
    container_name: campus_nginx_prod
    restart: always
    build:
      args:
        VITE_API_BASE_URL: /api
    # PAS de ports exposés - Traefik s'en charge
    volumes:
      # Configuration nginx simplifiée (sans SSL, Traefik gère le SSL)
      - ./docker/nginx/nginx.traefik.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - campus_network
      - traefik_public
    labels:
      # Activation de Traefik pour ce service
      - "traefik.enable=true"

      # Réseau à utiliser (important si plusieurs réseaux)
      - "traefik.docker.network=traefik_public"

      # Configuration du routeur HTTP -> HTTPS
      - "traefik.http.routers.campus-crawler.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.campus-crawler.entrypoints=websecure"
      - "traefik.http.routers.campus-crawler.tls=true"
      - "traefik.http.routers.campus-crawler.tls.certresolver=letsencrypt"

      # Service (port interne du conteneur nginx)
      - "traefik.http.services.campus-crawler.loadbalancer.server.port=80"

      # Optionnel: Support du www
      # - "traefik.http.routers.campus-crawler.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)"

networks:
  traefik_public:
    external: true
    name: traefik_public

volumes:
  mysql_prod_data:
    driver: local
