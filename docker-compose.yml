# Configuration de BASE - commune à tous les environnements

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-MonPass123!}
      MYSQL_DATABASE: ${DB_NAME:-campus_crawler}
      MYSQL_USER: ${DB_USERNAME:-campus_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-MonPass123!}
    networks:
      - campus_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-campus_crawler}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-campus_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-MonPass123!}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - campus_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9060/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ${FRONTEND_PATH:-./frontend}
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # networks défini dans les fichiers overlay (dev/prod)

networks:
  campus_network:
    driver: bridge

volumes:
  mysql_data:
