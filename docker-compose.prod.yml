# Configuration PRODUCTION VPS (avec SSL)
# Commande : docker-compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d
# Usage : Déploiement sur le VPS avec certificats SSL

services:
  mysql:
    container_name: campus_db_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # PAS de ports exposés

  backend:
    image: ${DOCKER_USERNAME}/campus-crawler-backend:${VERSION:-latest}
    container_name: campus_backend_prod
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    # PAS de ports exposés

  frontend:
    image: ${DOCKER_USERNAME}/campus-crawler-frontend:${VERSION:-latest}
    container_name: campus_nginx_prod
    restart: always
    build:
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Configuration nginx avec SSL
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificats SSL Let's Encrypt
      - /etc/letsencrypt/live/${DOMAIN}/fullchain.pem:/etc/ssl/certs/fullchain.pem:ro
      - /etc/letsencrypt/live/${DOMAIN}/privkey.pem:/etc/ssl/private/privkey.pem:ro
      # Pour les renewals certbot
      - /var/www/certbot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - campus_network

volumes:
  mysql_prod_data:
    driver: local