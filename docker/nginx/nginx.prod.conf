upstream backend {
    server backend:9060;  # le service Docker "backend", port interne 9060
}

# Limiteur global (doit rester au niveau http)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# ── Port 80 : ACME (si webroot) + redirection vers HTTPS
server {
    listen 80;
    server_name lucas-maiaux.fr www.lucas-maiaux.fr;

    # Pour les renouvellements Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tout le reste redirigé en HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Port 443 : site en HTTPS
server {
    listen 443 ssl http2;
    server_name lucas-maiaux.fr www.lucas-maiaux.fr;

    # Certificats montés depuis l'hôte (voir volumes dans docker-compose)
    ssl_certificate     /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/privkey.pem;

    # Configuration SSL moderne
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Headers sécurité
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logs (dans le conteneur nginx)
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Frontend - Fichiers statiques React
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Désactiver le cache pour index.html
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }
    }

    # Cache agressif pour les assets statiques (non imbriqué dans location /)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API - Reverse proxy vers Spring Boot
    location /api/ {
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;

        # Réécriture pour enlever /api du path
        rewrite ^/api/(.*)$ /$1 break;

        # Proxy vers backend
        proxy_http_version 1.1;
        proxy_pass http://backend;

        # Headers proxy
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffers
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # Bloquer les accès aux fichiers sensibles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
