upstream backend {
    server backend:9060;  # le service Docker "backend", port interne 9060
}

# Limiteur global (doit rester au niveau http)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Port 80 : Configuration HTTP simple (Traefik gère le SSL)
server {
    listen 80;
    server_name _;

    # Headers sécurité (HSTS géré par Traefik)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logs (dans le conteneur nginx)
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Frontend - Fichiers statiques React
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Désactiver le cache pour index.html
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }
    }

    # Cache agressif pour les assets statiques (non imbriqué dans location /)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API - Reverse proxy vers Spring Boot
    location /api/ {
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;

        # Réécriture pour enlever /api du path
        rewrite ^/api/(.*)$ /$1 break;

        # Proxy vers backend
        proxy_http_version 1.1;
        proxy_pass http://backend;

        # Headers proxy (Traefik ajoute X-Forwarded-*)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffers
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # Bloquer les accès aux fichiers sensibles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
